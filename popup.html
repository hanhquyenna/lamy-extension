<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px/1.5 -apple-system,system-ui,sans-serif;width:320px;padding:14px;color:#1a1a1a}
h1{font-size:15px;margin:0 0 8px}
label{display:block;margin:8px 0 2px;color:#6b6b6b;font-size:12px}
input{width:100%;box-sizing:border-box;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px}
button{margin-top:10px;background:#3d5a80;color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
#status{margin-top:12px;padding:8px;background:#f4f4f2;border-radius:6px;font-size:12px;white-space:pre-wrap}
</style></head><body>
<h1>Lamy Worker</h1>
<div style="font-size:12px;color:#6b6b6b">Runs only what you queued with Lamy in chat, at a careful pace, in your own browser.</div>
<label>Server address</label>
<input id="base" value="http://127.0.0.1:8790" placeholder="http://127.0.0.1:8790 or your tunnel URL">
<label>Pairing token (ask Lamy: "pair my extension")</label>
<input id="token" placeholder="lw_...">
<button id="save">Save and check in</button>
<div id="status">enter your pairing token</div>
<script src="popup.js"></script>
</body></html>
